[device]
codename = "ruyi"
brand = "Xiaomi"
model = "Xiaomi MIX Flip"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The configured display mode selects the inner panel, cover panel, or both.
width = 1224
height = 2912
# Reported logical density; confirm the UI scale on the phone.
density = 520
diagonal = 6.86

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The stock OS3.0.305.0.WNIMIXM module set includes both Goodix and
# Synaptics touch drivers; goodix_core depends on synaptics_tcm2 and xiaomi_touch.
load = ["goodix_core", "synaptics_tcm2"]

[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

[[touch.panels]]
device = "synaptics_tcm_touch"
display_index = 0
role = "internal"
width = 1224
height = 2912

[[touch.panels]]
device = "goodix_ts"
display_index = 1
role = "external"
width = 1208
height = 1392
# The visible cover output is 180 degrees relative to scanout; keep pixels
# unrotated in software and correct touch coordinates independently.
display_rotation = 0
touch_rotation = 180

# The stock fstab mounts modem at /vendor/firmware_mnt and persist at
# /mnt/vendor/persist. The vendor image points the WLAN settings and MAC
# address to these files.
[firmware]
partition = "modem"

# The secure world keeps files on persist, and its services need the stock
# mount point before they start.
[partitions]
mounted = ["persist"]

# QSEE and KeyMint are needed for hardware-wrapped data keys. Verify these
# product-specific paths, properties, and labels against Ruyi's stock init.
[[service]]
path = "/vendor/bin/qseecomd"
selinux = true
# Match stock init policy: tee_exec transitions to tee.
seclabel = "u:r:tee:s0"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
ready_property_value = "true"
user = "root"
groups = ["root", "drmrpc"]
[[service.sockets]]
name = "notify-topology"
type = "stream"
mode = 0o660
user = "system"
group = "drmrpc"

[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
selinux = true
# Match vendor init policy: this executable transitions to its QTI HAL domain.
seclabel = "u:r:vendor_hal_keymint_qti:s0"
# Keep recovery's Binder runtime ahead of mounted platform copies; they use different parcel headers.
libraries = ["/vendor/lib64", "/system/lib64", "/mnt/system/system/lib64"]
preloads = [
    "/mnt/system/system/lib64/bootstrap/libdl_android.so",
    "/mnt/system/system/lib64/libc++.so",
]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# Global HyperOS updater endpoint.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The phone's secure-world data and fingerprint state must not be restored
# from an older backup.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/mitee",
    "vendor/goodix",
    "vendor/fingerprint",
    "vendor/fpdata",
    "vendor/misc/mi_fp",
]

[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ramdump_ssr",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]

# qcom-hv-haptics is present in the stock recovery module set. These are
# conservative levels from the Snapdragon 8 Gen 3 Xiaomi 14 Ultra; motor
# feel still needs verification on the MIX Flip itself.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }

[stock]
version = "OS3.0.305.0.WNIMIXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.305.0.WNIMIXM/ruyi_global-ota_full-OS3.0.305.0.WNIMIXM-user-16.0-178674f287.zip"
recovery = "6a8df6bb483be23a293f07e645df56946bca3e25ec1a5fbbc0cb83f4c51ce50f"
