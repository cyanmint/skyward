[device]
codename = "ruyi"
brand = "Xiaomi"
model = "Xiaomi MIX Flip"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The configured display mode selects the inner panel, cover panel, or both.
width = 1224
height = 2912
# Reported logical density; confirm the UI scale on the phone.
density = 520
diagonal = 6.86

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The stock OS3.0.305.0.WNIMIXM module set includes both Goodix and
# Synaptics touch drivers; goodix_core depends on synaptics_tcm2 and xiaomi_touch.
load = ["goodix_core", "synaptics_tcm2"]

[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

[[touch.panels]]
device = "synaptics_tcm_touch"
display_index = 0
role = "internal"
width = 1224
height = 2912

[[touch.panels]]
device = "goodix_ts"
display_index = 1
role = "external"
width = 1208
height = 1392
# Rotate both the outer display and touchscreen 180 degrees so the
# camera-safe area and touch coordinates match the panel orientation.
display_rotation = 180
touch_rotation = 180

# The stock fstab mounts modem at /vendor/firmware_mnt and persist at
# /mnt/vendor/persist. The vendor image points the WLAN settings and MAC
# address to these files.
[firmware]
partition = "modem"

[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# Global HyperOS updater endpoint.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The phone's secure-world data and fingerprint state must not be restored
# from an older backup.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/mitee",
    "vendor/goodix",
    "vendor/fingerprint",
    "vendor/fpdata",
    "vendor/misc/mi_fp",
]

[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ramdump_ssr",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]

# qcom-hv-haptics is present in the stock recovery module set. These are
# conservative levels from the Snapdragon 8 Gen 3 Xiaomi 14 Ultra; motor
# feel still needs verification on the MIX Flip itself.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }

[stock]
version = "OS3.0.305.0.WNIMIXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.305.0.WNIMIXM/ruyi_global-ota_full-OS3.0.305.0.WNIMIXM-user-16.0-178674f287.zip"
recovery = "6a8df6bb483be23a293f07e645df56946bca3e25ec1a5fbbc0cb83f4c51ce50f"
